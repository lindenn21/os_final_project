<!DOCTYPE html>
<html>
<head>
    <title>OS Finals</title>

    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/header.css') }}">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
    margin:0;
    background:#f4f6f9;
    font-family:Arial, sans-serif;

    min-height:100vh;
    display:flex;
    flex-direction:column;
}
            
        .container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:40px;
}

        .title{
            margin-top:60px;
            font-size:4rem;
            font-weight:bold;
            text-align:center;
            letter-spacing:3px;
        }

        .subtitle {
    margin-top: 10px;
    color: #555;
    font-size: 1.2rem;

    text-align: center;
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
}

        .button-container{
    width:90%;
    max-width:1200px;

    margin:60px auto;

    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:30px;
}

        .module-btn{
            height:180px;

            background:white;

            border:none;
            border-radius:30px;

            text-decoration:none;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:2rem;
            font-weight:bold;

            color:black;

            box-shadow:0 5px 20px rgba(0,0,0,0.15);

            transition:0.3s;
        }

        .module-btn:hover{
            transform:translateY(-8px);
            box-shadow:0 10px 30px rgba(0,0,0,0.25);
        }

    
    </style>
</head>

<body>

{% include 'header.html' %}

    <div class="container">
        
    <h1 class="title">ALGORACISM</h1>

    <p class="subtitle">
        An Operating System project led by the most racist individual known to mankind
    </p>

    <div class="button-container">

        <a href="/cpu-scheduling" class="module-btn">
            CPU SCHEDULING
        </a>

        <!-- Future Button -->
        <a href="#" class="module-btn">
            MEMORY MANAGEMENT
        </a>

        <!-- Future Button -->
        <a href="#" class="module-btn">
            VIRTUAL MEMORY
        </a>

        <!-- Future Button -->
        <a href="#" class="module-btn">
            DISK MANAGEMENT
        </a>

    </div>

</body>
</html>
