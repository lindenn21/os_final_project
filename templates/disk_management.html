<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Disk Management</title>

    <link rel="stylesheet"href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet"href="{{ url_for('static', filename='css/disk_management.css') }}">

</head>  
<body>

{% include 'header.html' %}

<div class="container">

    <a href="/" class="back-btn">
        ← Back to Home
    </a>
    <h1>Disk Management</h1>

    <form method="POST">

        <label>Number of Tracks</label>

        <input
            type="number"
            name="tracks"
            placeholder="200"
            required>

        <label>Request Queue (comma separated)</label>

        <input
            type="text"
            name="requests"
            placeholder="55, 58, 39, 18, 90, 160, 150, 38, 184"
            required>

        <label>Initial Head Position</label>

        <input
            type="number"
            name="initial_head"
            placeholder="50"
            required>

        <label>Scheduling Algorithm</label>

        <select name="algorithm">
            <option value="FCFS">First-Come-First-Serve (FCFS)</option>
            <option value="SSTF">Shortest Seek Time First (SSTF)</option>
            <option value="SCAN">SCAN (Elevator)</option>
            <option value="C-SCAN">Circular SCAN (C-SCAN)</option>

        </select>

        <label>Direction (Used only for SCAN and C-SCAN)</label>

        <select name="direction">
            <option value="LEFT">Left</option>
            <option value="RIGHT">Right</option>

        </select>

        <button type="submit">
            Simulate
        </button>

    </form>

{% if seek_sequence %}

<div class="results">

    <h2>Simulation Results</h2>

    <p>
        <strong>Seek Sequence:</strong>
        {{ seek_sequence }}
    </p>

    <p>
        <strong>Total Head Movement:</strong>
        {{ total_seek }}
    </p>

    <table>

        <tr>
            <th>Step</th>
            <th>Track</th>
        </tr>

        {% for track in seek_sequence %}

        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ track }}</td>
        </tr>

        {% endfor %}

    </table>

</div>

{% endif %}

</div>

</body>
</html>
